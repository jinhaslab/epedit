<div class="sidebar-status">
    <h3 class="status-title">접속 중인 사용자 ({{ online_users.count }})</h3>
    <ul class="user-list">
        {% for user in online_users %}
            <li class="status-item">
                <span class="status-user">{{ user.username }}</span>
                <span class="status-indicator"></span>
            </li>
        {% empty %}
            <li class="status-item-empty">
                접속 중인 사용자가 없습니다.
            </li>
        {% endfor %}
    </ul>
</div>

<style>
/* 기존 CSS에 이 스타일을 추가하거나 여기에 두어도 됩니다. */
.user-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.status-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 5px;
    font-size: 14px;
}

.status-indicator {
    width: 10px;
    height: 10px;
    background-color: #2E7D32;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
}

.status-user {
    color: #343a40;
    font-weight: 500;
}

.status-item-empty {
    font-size: 14px;
    color: #6c757d;
    padding: 6px 5px;
}
</style>
