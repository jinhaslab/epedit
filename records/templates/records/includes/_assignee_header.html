{% if assignee %}
<style>
    :root {
        --assignee-color: {{ assignee.color }};
    }
</style>

<!-- Breadcrumb Navigation -->
<nav class="breadcrumb-nav">
    <a href="{% url 'record_list' %}">전체 목록</a>
    <span>›</span>
    <span>{{ assignee.name }}의 작업 영역</span>
</nav>

<!-- Assignee Workspace Header -->
<div class="assignee-workspace-header">
    <h2>👤 {{ assignee.name }}의 작업 영역</h2>
    <p>IDS 범위: {{ assignee.ids_from }} - {{ assignee.ids_to }}</p>

    <div class="progress-bar-large">
        <div class="progress" style="width: {{ assignee.progress_percentage }}%;"></div>
    </div>

    <div class="stat-grid">
        <div class="stat-card-assignee">
            <div class="stat-number">{{ assignee.total_records }}</div>
            <div class="stat-label">전체 레코드</div>
        </div>
        <div class="stat-card-assignee">
            <div class="stat-number">{{ assignee.completed_records }}</div>
            <div class="stat-label">완료</div>
        </div>
        <div class="stat-card-assignee">
            <div class="stat-number">{{ assignee.progress_percentage }}%</div>
            <div class="stat-label">진행률</div>
        </div>
    </div>
</div>
{% endif %}
