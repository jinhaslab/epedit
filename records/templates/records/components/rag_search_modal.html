<div class="modal fade" id="ragSearchModal" tabindex="-1" role="dialog" aria-labelledby="ragSearchModalLabel" aria-hidden="true">

      <div class="modal-header">
        <h5 class="modal-title" id="ragSearchModalLabel">직종 RAG 검색</h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">

      </div>
      <div class="modal-body">
        <div class="rag-search-input-group mb-3">

      </div>

  </div>
</div>
