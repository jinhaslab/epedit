<!-- confirmation_section.html -->
<div class="confirmation-section">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
    <h3 style="margin: 0;">확인 체크박스</h3>
    <button type="button" onclick="checkAllConfirmations()" class="btn btn-secondary" style="padding: 8px 16px; font-size: 14px;">일괄 확인</button>
  </div>
  <table class="confirmation-table">
    <tr>
      <td>
        <input type="checkbox" id="id_disease_confirmed" name="disease_confirmed" {% if record.disease_confirmed %}checked{% endif %} />
        <label for="id_disease_confirmed">질병 확인</label>
      </td>
      <td>
        <input type="checkbox" id="id_job_confirmed" name="job_confirmed" {% if record.job_confirmed %}checked{% endif %} />
        <label for="id_job_confirmed">직종 확인</label>
      </td>
      <td>
        <input type="checkbox" id="id_exposure_confirmed" name="exposure_confirmed" {% if record.exposure_confirmed %}checked{% endif %} />
        <label for="id_exposure_confirmed">유해인자 확인</label>
      </td>
    </tr>
    <tr>
      <td>
        <input type="checkbox" id="id_decision_confirmed" name="decision_confirmed" {% if record.decision_confirmed %}checked{% endif %} />
        <label for="id_decision_confirmed">결정 확인</label>
      </td>
      <td>
        <input type="checkbox" id="id_smry_confirmed" name="smry_confirmed" {% if record.smry_confirmed %}checked{% endif %} />
        <label for="id_smry_confirmed">고찰 확인</label>
      </td>
      <td></td>
    </tr>
  </table>
</div>

<div class="form-section" style="margin-top: 24px;">
  <h3>논의 사항</h3>
  <textarea name="discussion_notes" id="id_discussion_notes" rows="5" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; resize: vertical;" placeholder="논의 사항을 입력하세요...">{{ record.discussion_notes|default:'' }}</textarea>
</div>

<script>
function checkAllConfirmations() {
  document.getElementById('id_disease_confirmed').checked = true;
  document.getElementById('id_job_confirmed').checked = true;
  document.getElementById('id_exposure_confirmed').checked = true;
  document.getElementById('id_decision_confirmed').checked = true;
  document.getElementById('id_smry_confirmed').checked = true;
}
</script>
